<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="api-base" content="https://bosera-backend.onrender.com">
  <title>Clothing – BOSERA</title>
  <link rel="stylesheet" href="/mobile/mobile.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="clothing">

<main>
  <section class="m-page-hero">
    <span class="eyebrow">BOSERA</span>
    <h1>Clothing</h1>
    <p>Explore our full collection — tees, shirts, bottoms & more.</p>
  </section>

  <section class="m-filterbar">
    <div class="m-filter-row">
      <span class="m-filter-label"><i class="fas fa-filter"></i> Filter</span>
      <div class="m-chips" id="mFilterChips"></div>
    </div>
    <div class="m-filter-row">
      <span class="m-filter-label"><i class="fas fa-arrow-down-wide-short"></i> Sort</span>
      <select class="m-sort-select" id="mSortSelect">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name">Name: A-Z</option>
      </select>
    </div>
    <div class="m-filter-count" id="mFilterCount"></div>
  </section>

  <div class="m-grid" id="mCatGrid" style="padding-bottom:24px;"></div>
</main>

<script src="/mobile/mobile.js?v=3"></script>
<script src="/mobile/shared.js?v=3"></script>
</body>
</html>
