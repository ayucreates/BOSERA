<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact Us – BOSERA</title>
  <link rel="stylesheet" href="/mobile/mobile.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<main>
  <section class="m-page-hero">
    <span class="eyebrow">BOSERA</span>
    <h1>Contact Us</h1>
    <p>7-day hassle-free exchanges &amp; refunds.</p>
  </section>

  <div class="m-tiles">
    <div class="m-tile"><i class="fab fa-whatsapp"></i><h3>WhatsApp</h3><p>Quick replies, all day</p><a href="https://wa.me/917636811101" target="_blank">Chat Now</a></div>
    <div class="m-tile"><i class="fas fa-envelope"></i><h3>Email</h3><p>Litebouys4@gmail.com</p><a href="mailto:Litebouys4@gmail.com">Email Us</a></div>
    <div class="m-tile"><i class="fas fa-phone"></i><h3>Call</h3><p>Mon–Sat, 10AM–7PM</p><a href="tel:+917636811101">+91 76368 11101</a></div>
    <div class="m-tile"><i class="fas fa-map-marker-alt"></i><h3>Visit Us</h3><p>Kokrajhar, Assam</p><a href="https://maps.google.com/?q=Kokrajhar+Assam" target="_blank">Directions</a></div>
  </div>

  <div class="m-form" style="padding-top:20px;">
    <h2>Send a Message</h2>
    <form id="contactFormMobile">
      <div class="m-field"><label>Full Name *</label><input name="cname" type="text"></div>
      <div class="m-field"><label>Email *</label><input name="cemail" type="email"></div>
      <div class="m-field"><label>Subject *</label><input name="csubject" type="text" placeholder="Order / Return / General"></div>
      <div class="m-field"><label>Message *</label><textarea name="cmessage" rows="5" placeholder="How can we help?"></textarea></div>
      <button class="btn btn-dark btn-block" type="submit">Send Message</button>
    </form>
    <p class="m-success hidden" id="contactOk"></p>
  </div>
</main>

<script src="/mobile/mobile.js?v=1"></script>
<script src="/mobile/shared.js?v=1"></script>
</body>
</html>
