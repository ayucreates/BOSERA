<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wishlist – BOSERA</title>
  <link rel="stylesheet" href="/mobile/mobile.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="wishlist">

<main>
  <section class="m-page-hero">
    <span class="eyebrow">BOSERA</span>
    <h1>My Wishlist</h1>
    <p id="mWishCount">0 items saved</p>
  </section>

  <div class="m-grid" id="mWishGrid" style="padding-bottom:24px;"></div>

  <div class="m-empty" id="mWishEmpty" style="display:none;">
    <i class="fas fa-heart"></i>
    <h3>Your wishlist is empty</h3>
    <p>Save items you love by tapping the heart icon on any product.</p>
    <a class="btn btn-dark" href="/" style="display:inline-flex;">Start Shopping</a>
  </div>
</main>

<script src="/mobile/mobile.js?v=1"></script>
<script src="/mobile/shared.js?v=1"></script>
</body>
</html>
